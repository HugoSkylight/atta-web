<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Language URL check</title>
<style>
body{font:15px/1.6 ui-monospace,Menlo,monospace;background:#141016;color:#F1F0EE;margin:24px}
pre{white-space:pre-wrap}
iframe{width:100%;max-width:1280px;height:600px;border:1px solid #555;background:#fff}
.note{color:#A79FAB}
</style>
</head>
<body>
<p class="note">Manual check for the real language URLs. Needs same-origin: run <code>python3 -m http.server</code> here and open <code>/i18n-check.html</code>. This page is excluded from the sitemap and marked noindex.</p>
<pre id="out">running…</pre>
<iframe id="f" title="language check frame"></iframe>
<script>
const CJK = /[\u3400-\u9fff\u3000-\u303f\uff00-\uffef]/;
const out = document.getElementById('out');
const frame = document.getElementById('f');
const log = [];
const ok = (cond, msg) => log.push((cond ? 'PASS ' : 'FAIL ') + msg);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LOCAL_BASE = location.origin + location.pathname.replace(/[^/]*$/, '');
const localCan = path => new URL(path.replace(/index\.html$/, ''), LOCAL_BASE).href;

const PAIRS = [
  ['index.html', 'zh/index.html'],
  ['project/index.html', 'zh/project/index.html'],
  ['privacy/index.html', 'zh/privacy/index.html'],
  ['security/index.html', 'zh/security/index.html'],
  ['changelog/index.html', 'zh/changelog/index.html'],
];

const loadDoc = async path => {
  const res = await fetch(path, { cache: 'no-store' });
  if (!res.ok) throw new Error(path + ' returned ' + res.status);
  return new DOMParser().parseFromString(await res.text(), 'text/html');
};

const hreflang = doc => new Map([...doc.querySelectorAll('link[rel=alternate][hreflang]')].map(el => [el.getAttribute('hreflang'), el.href]));

const checkPage = (doc, path, otherPath, lang, canonical, alternates) => {
  ok(doc.documentElement.lang === lang, path + ' html lang is ' + lang);
  ok(doc.querySelector('link[rel=canonical]')?.href === canonical, path + ' canonical is ' + canonical);
  const alt = hreflang(doc);
  for (const [key, href] of Object.entries(alternates)) ok(alt.get(key) === href, path + ' hreflang ' + key);
  const link = doc.querySelector('a.lang');
  ok(!!link, path + ' has a language link');
  if (link) {
    const target = new URL(link.getAttribute('href'), new URL(path, LOCAL_BASE)).href;
    ok(target === localCan(otherPath), path + ' language link reaches ' + localCan(otherPath));
    ok(!link.hasAttribute('data-auto') && !doc.querySelector('meta[http-equiv=refresh]'), path + ' has no language redirect');
  }
};

const loadFrame = async path => {
  await new Promise(resolve => {
    frame.onload = () => setTimeout(resolve, 500);
    frame.src = path + '?check=' + Date.now();
  });
  return frame.contentDocument;
};

(async () => {
  const home = await loadDoc('index.html');
  const SITE_ROOT = new URL(home.querySelector('link[rel=canonical]').href);
  const can = path => new URL(path.replace(/index\.html$/, ''), SITE_ROOT).href;
  for (const [enPath, zhPath] of PAIRS) {
    const en = await loadDoc(enPath);
    const zh = await loadDoc(zhPath);
    const enCanonical = can(enPath);
    const zhCanonical = can(zhPath);
    const alternates = { en: enCanonical, 'zh-Hans': zhCanonical, 'x-default': enCanonical };
    checkPage(en, enPath, zhPath, 'en', enCanonical, alternates);
    checkPage(zh, zhPath, enPath, 'zh-Hans', zhCanonical, alternates);
    ok(en.title !== zh.title, enPath + ' and ' + zhPath + ' have different titles');
    ok(CJK.test(zh.title), zhPath + ' title is Chinese');
  }

  const zhDoc = await loadFrame('zh/index.html');
  ok(zhDoc.documentElement.lang === 'zh-Hans', 'zh home runs with html lang=zh-Hans');
  ok(CJK.test(zhDoc.getElementById('drawer').textContent), 'zh demo drawer is Chinese');
  ok(CJK.test(zhDoc.getElementById('topo-tip').textContent), 'zh topology tip is Chinese');
  ok([...zhDoc.querySelectorAll('.ticker span')].every(s => CJK.test(s.textContent)), 'zh ticker is Chinese');
  zhDoc.getElementById('g-pass').click();
  ok(zhDoc.getElementById('g-chip').textContent === '已通过', 'zh gate decision is Chinese');
  frame.contentWindow.location.hash = 'core';
  await sleep(80);
  ok(zhDoc.querySelector('a.lang').href.endsWith('#core'), 'zh language link keeps a valid hash');

  const enDoc = await loadFrame('index.html');
  ok(enDoc.documentElement.lang === 'en', 'en home runs with html lang=en');
  ok(!CJK.test(enDoc.getElementById('drawer').textContent), 'en demo drawer has no Chinese');
  ok(enDoc.querySelector('a.lang').getAttribute('href').startsWith('zh/'), 'en language link points at zh/');

  const fails = log.filter(line => line.startsWith('FAIL')).length;
  out.textContent = log.join('\n') + '\n\n' + (fails ? fails + ' FAILED' : 'ALL PASS');
  document.title = fails ? 'FAIL' : 'PASS';
})().catch(error => {
  out.textContent = log.join('\n') + '\nERROR ' + error.stack;
  document.title = 'FAIL';
});
</script>
</body>
</html>
